name: Daily wildfire dashboard

# Publishes the NEWEST committed real-data dashboard snapshot to GitHub Pages.
#
# The repo ships real snapshots under wildfire_output/<date>/ (heatmap HTML +
# summary JSON + scored parquet), generated locally from the trained models
# and live 2 km GEE pulls. This workflow picks the latest date directory,
# stages it as the site index, and deploys to gh-pages. It reruns nightly so
# the deployment stays fresh, and on push whenever a snapshot or the workflow
# changes. The DATA refreshes when a new snapshot is committed — CI holds no
# GEE credentials, so it redeploys real numbers rather than rendering
# synthetic stand-ins.
#
# To upgrade to truly live daily data: add a GEE service-account JSON as the
# GEE_SA_JSON secret and a step that runs
# `python -m wildfire.dashboard --date $(date -u +%Y-%m-%d)` before deploy.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "wildfire_output/**"
      - ".github/workflows/daily-dashboard.yml"

permissions:
  contents: write

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Stage site/
        run: |
          mkdir -p site
          # Newest committed snapshot: date-named dirs sort chronologically.
          LATEST=$(find wildfire_output -mindepth 2 -maxdepth 2 -name 'heatmap_*.html' | sort | tail -n 1)
          if [ -z "$LATEST" ]; then
            echo "No committed dashboard snapshot found" >&2
            exit 1
          fi
          SNAP_DIR=$(dirname "$LATEST")
          DATE=$(basename "$SNAP_DIR")
          echo "Deploying snapshot: $DATE"
          cp "$SNAP_DIR/heatmap_$DATE.html" site/index.html
          cp "$SNAP_DIR/heatmap_$DATE.html" "site/heatmap_$DATE.html"
          [ -f "$SNAP_DIR/summary_$DATE.json" ] && cp "$SNAP_DIR/summary_$DATE.json" site/
          # Light fingerprint for verification
          ls -la site/
          echo "Page size: $(wc -c < site/index.html) bytes"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: false
          commit_message: "ci: deploy latest real-data dashboard snapshot"
