name: Daily wildfire dashboard

# Deploys the latest real-data dashboard to GitHub Pages.
#
# The repo ships a real Sept 15 2025 snapshot (heatmap_2025-09-15.html)
# generated from the trained XGBoost model + cached 2 km GEE pulls.
# This workflow copies that snapshot to a `site/` dir and publishes to
# gh-pages. It runs nightly to keep the deployment fresh, and on push
# whenever the snapshot or workflow changes.
#
# To upgrade to truly live data later: add a GEE service-account JSON as
# the GEE_SA_JSON secret, and a `gh-pages-real` step that runs
# `python -m wildfire.dashboard --date $(date -u +%Y-%m-%d)` before the
# deploy step. The current setup is the simplest reproducible thing that
# always shows real numbers without CI auth.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "wildfire_output/2025-09-15/heatmap_2025-09-15.html"
      - ".github/workflows/daily-dashboard.yml"

permissions:
  contents: write

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Stage site/
        run: |
          mkdir -p site
          # The repo ships exactly one real dashboard snapshot — use it as
          # both the index and the dated file.
          SNAPSHOT="wildfire_output/2025-09-15/heatmap_2025-09-15.html"
          cp "$SNAPSHOT" site/index.html
          cp "$SNAPSHOT" site/heatmap_2025-09-15.html
          cp "wildfire_output/2025-09-15/summary_2025-09-15.json" site/
          # Light fingerprint for verification
          ls -la site/
          echo "Page size: $(wc -c < site/index.html) bytes"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: false
          commit_message: "ci: deploy real-data dashboard snapshot"
